[package]
name = "desktop-dles"
version = "0.1.0"
description = "Daily routine of dles in one window"
edition = "2024"
rust-version = "1.90"

[lib]
name = "desktop_dles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = "1.0.229"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
