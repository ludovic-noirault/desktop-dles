[package]
name = "desktop-dles"
version = "0.1.0"
description = "Daily routine of dles in one window"
edition = "2024"
rust-version = "1.90"

[lib]
name = "desktop_dles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# `rustls-no-provider` plus ring below: the default `rustls` feature would add aws-lc, a second C crypto stack
# next to the ring one tauri-plugin-updater already links.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The updater has no mobile support.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

# WebKit content rule lists for the game webviews. Default features are off: they enable every
# class of the framework and pull in JavaScriptCore and Security bindings this app does not use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "block2"] }

# WebView2 request filtering for the game webviews. Same majors as wry 0.57.1, so the COM types are the
# ones `PlatformWebview::controller()` and `environment()` return. Only `windows::core` is used, which
# needs no feature.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
